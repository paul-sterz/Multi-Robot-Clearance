# HB Allen Centre -- Kolling et al. (2010) as published
#
# GSST over random depth-first spanning forests of the guard graph:
# the Barriere et al. label recursion with sliding forbidden, then the
# tree strategy converted back to a graph strategy by stationing a
# robot wherever a cycle edge leads into a contaminated vertex.
# Produced by scripts/run_gsst.py.

scene: hb-allen-centre
scenario_file: ../scenes/hb-allen-centre.yaml
trees_per_variant: 100
seed: 1

graph:
  vertices: 32
  edges: 229
  edges_regular: 165
  edges_shady: 64

variants:
  # team_* are the peak of the GRAPH strategy over the drawn forests.
  # The paper's own output; a claim about the guard graph under vertex
  # contamination, not about the surface.
  - variant: naive
    trees: 100
    searchers_min: 16
    searchers_mean: 19.51
    searchers_sd: 1.82
    searchers_max: 24
    tree_label_min: 1
    tree_label_at_best: 3
    steps: 32
    shady_in_best_tree: 6
    cycle_edges_in_best: 198
    graph_cleared: True
    verified_on_cells:
      # the same strategy, judged by clearing.verify, which is
      # told nothing about guard regions or shadiness. Steps
      # are instantaneous here: nobody is ever in transit.
      steps: 32
      n_searchers: 16
      searchers_median: 9
      cleared: False
      cleared_except_uncoverable: False
      residual_cells: 29623
      residual_m2: 1184.92
      recontamination_events: 1
      recontaminated_cells: 29604
      absorb_m2: 1.0
      absorbed_cells: 989
      makespan_s: 688.1
      fleet: 16
    driven_no_sliding:
      # the same strategy executed one robot at a time, with
      # the 2010 prohibition kept: a robot in transit is
      # credited with nothing, so a drive is admissible only
      # when the standing team covers the frontier by itself.
      legs: 32
      fleet: 16
      legs_holding: 32
      legs_conceding: 0
      conceded_m2_total: 0.0
      conceded_m2_worst: 0.0
      walking_s: 552.7
      machines_spent: 0
      atomic_searchers: 16
