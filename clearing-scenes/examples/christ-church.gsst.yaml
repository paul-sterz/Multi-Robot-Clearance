# Christ Church -- Kolling et al. (2010) as published
#
# GSST over random depth-first spanning forests of the guard graph:
# the Barriere et al. label recursion with sliding forbidden, then the
# tree strategy converted back to a graph strategy by stationing a
# robot wherever a cycle edge leads into a contaminated vertex.
# Produced by scripts/run_gsst.py.

scene: christ-church
scenario_file: ../scenes/christ-church.yaml
trees_per_variant: 100
seed: 1

graph:
  vertices: 81
  edges: 367
  edges_regular: 233
  edges_shady: 134

variants:
  # team_* are the peak of the GRAPH strategy over the drawn forests.
  # The paper's own output; a claim about the guard graph under vertex
  # contamination, not about the surface.
