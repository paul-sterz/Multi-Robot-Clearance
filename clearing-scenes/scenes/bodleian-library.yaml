# Bodleian Library -- ground-platform clearing scenario
#
# Vertices are sampled sensor positions on the walkable surface. An edge
# (i, j) exists where a searcher at j can watch part of dD(p_i), the
# boundary of what a searcher at i sees: the guard region G_ij of
# Kolling et al. 2010. `routes` gives the platform's travel time
# between every pair of vertices;
# the path it actually walks along each edge is in the npz beside it.
#
# Regenerate with scripts/export_from_e1.py; see docs/scene-format.md.

scene: bodleian-library
title: Bodleian Library

source:
  dataset: Oxford Spires Dataset (Tao et al., IJRR 2025)
  survey: terrestrial laser scan, merged cloud + individual E57 setups
  pipeline: e1-clearing-graph, stages 2-6
  occupancy: O-carved (unobserved space blocks)
  graph_file: carved_huav20_R30_seed1
  vertex_set: repaired-ground
  vertex_set_note: E1 Stage 5/6 plus e2.gsst.repair_scene(level='ground'); guard graph rebuilt with e1.graph.build_graph and checked against e2.gsst.ground_guide
  note: the ground half of E1's two-platform graph; identical for every h_uav, which only selects the file

platform:
  kind: ground
  sensor_height_m: 1.0
  detection_range_m: 30.0
  speed_m_s: 1.0

target:
  height_m: 1.0
  radius_m: 0.25
  visibility: all 5 rays to the target cylinder must pass

site_boundary:
  # Where the scenario stops. Drawn by hand in e1-clearing-graph
  # (configs/site_boundary.yaml) and approved there; the surface,
  # the vertices, the guard regions and the routes below are all
  # what survives it. The evader cannot leave it and no searcher has
  # to watch across it: the drawn lines are held, not open frontier.
  bounded: true
  stamp: a20b8b56f9cf            # hash of the drawn lines; matches E1's approval
  approved: 2026-08-22
  source: e1-clearing-graph configs/site_boundary.yaml, drawn by hand
  cuts: 12                  # hand-drawn lines across the openings
  held_line_m: 117.5          # how much of the perimeter those lines are
  cells_dropped: 37239       # walkable cells outside it, removed before anything was indexed
  walkable_dropped_m2: 1489.6   # what that is in area: surveyed ground this scenario gives up
  excluded_m2: 1665.4           # E1's own figure, measured on its 0.4 m boundary raster rather
                              # than on this 0.2 m walkable surface, so the two differ slightly
  outline_segments: 7062
  outline_length_m: 2824.8    # the whole outline, in the npz as site_boundary_seg

surface:
  geometry_file: geometry/bodleian-library.npz
  cell_size_m: 0.2
  cells: 286733
  area_m2: 11469.32
  bbox_min: [-167.71, 169.34, -3.03]
  bbox_max: [106.09, 432.34, 0.88]
  max_step_m: 0.25          # height a neighbouring cell may differ by
  evader_edges: 1115374       # 8-connected under that rule; recomputed, not stored
  uncoverable_cells: 8472   # seen by no vertex, at any team size
  uncoverable_area_m2: 338.88

graph:
  vertices: 151
  edges: 1408
  edges_regular: 1043
  edges_shady: 365

  # id, sensor position [m], the area D(p) the vertex sees, and how
